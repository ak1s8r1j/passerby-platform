name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      # Starts a throwaway Postgres, applies the migrations and runs the database tests.
      - run: npm run test:integration
      - run: npm run build
      # Fails the build only for problems in code that ships to users (not dev tools).
      - run: npm audit --omit=dev --audit-level=critical
