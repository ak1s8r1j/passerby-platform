# Local Postgres for development: `npm run db:up`
# No Docker? Use `npm run db:embedded` instead; it serves the same address.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: passerby
      POSTGRES_PASSWORD: passerby
      POSTGRES_DB: passerby
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passerby"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
